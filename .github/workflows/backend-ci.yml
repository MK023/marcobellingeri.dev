name: Backend CI

# Tutto automatico, niente step manuali (scelta 2026-07-07):
#  - test (unit+integration, zero secret) su PR e push main
#  - gitleaks full-history su PR e push main
#  - db-rebuild: TUTTE le migration + seed su Postgres+pgvector EFFIMERO,
#    con assert su schema e publish gate -> "ricostruibile da zero" verificato a ogni push
#  - e2e (secrets, DB live, dati sintetici+teardown) SOLO su push main, mai su PR
# Nessun filtro per path, di proposito. Questi job sono check obbligatori nel
# ruleset di main: un workflow che non parte non riporta nulla, e un check
# obbligatorio che non riporta lascia la PR bloccata in attesa per sempre.
# Girare sempre costa una cinquantina di secondi; il filtro costerebbe una PR
# inmergiabile ogni volta che si tocca solo un .md.
on:
  pull_request:
  push:
    branches: [main]
  # Le PR create col GITHUB_TOKEN (cron Edicola card) non triggerano
  # `pull_request`: il workflow le lancia via dispatch sul branch della card.
  workflow_dispatch: {}

# Default per tutti i job; il permesso in più di gitleaks sta SUL SUO job
# (modello pipeline-cicd: permissions per job, non per workflow — un permesso a
# livello workflow è concesso anche ai job che non ne hanno bisogno).
permissions:
  contents: read

# un solo run alla volta per ref: l'e2e usa un namespace sintetico fisso
# (9999-01) sul DB live — run concorrenti si pesterebbero i piedi
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Unit + integration (zero rete, e2e skippa)
        working-directory: engine
        run: npm test

  gitleaks:
    # gitleaks-action, sugli eventi pull_request, chiama
    # GET /repos/{owner}/{repo}/pulls/{n}/commits per sapere cosa scansionare.
    # Senza `pull-requests: read` quella chiamata torna 403 e il job muore su
    # OGNI PR (era la vera causa storica dello skip, non il token di Dependabot).
    permissions:
      contents: read
      pull-requests: read
    # Lo skip resta finché non è verificato su una PR reale di Dependabot: lì il
    # GITHUB_TOKEN e' comunque piu' ristretto per policy GitHub. Ma la causa del
    # fallimento storico era il permesso `pull-requests: read` mancante (vedi
    # sopra), non l'attore: senza quello l'action moriva su OGNI PR.
    # Il full-history scan gira su ogni push main, quindi ogni merge resta coperto.
    #
    # Si guarda l'AUTORE della PR, non `github.actor`: `actor` e' chi ha innescato
    # l'evento e cambia a ogni push sul branch (un `update-branch` per soddisfare
    # la branch protection lo fa diventare un umano, riaprendo in silenzio un job
    # che questa riga voleva chiuso). `pull_request.user.login` e' immutabile per
    # la PR ed e' il campo che GitHub usa nei suoi esempi per Dependabot.
    # Su push e workflow_dispatch il contesto pull_request non esiste: l'espressione
    # e' null, la condizione resta vera e il job gira come prima.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # full history
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # L'action non pesca .gitleaks.toml da sola: senza questa riga gira con le
          # regole di default e ignora la nostra unica eccezione (la project key di
          # Sonar, che non e' un segreto). L'hook pre-commit invece lo trova da se'.
          GITLEAKS_CONFIG: .gitleaks.toml

  db-rebuild:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Bootstrap ambiente (schema extensions + ruoli Supabase)
        run: psql -v ON_ERROR_STOP=1 -f supabase/ci/bootstrap.sql
      - name: Applica tutte le migration in ordine
        run: |
          for f in supabase/migrations/*.sql; do
            echo "== $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Seed idempotente (2 volte, stesso risultato)
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/seeds/competitors.sql
          psql -v ON_ERROR_STOP=1 -f supabase/seeds/competitors.sql
      - name: Assert schema + publish gate
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare n int;
          begin
            -- 10 tabelle, tutte con RLS (8 + visibility_queries/observations, migration 0011)
            select count(*) into n from pg_tables where schemaname='public';
            if n <> 10 then raise exception 'attese 10 tabelle, trovate %', n; end if;
            select count(*) into n from pg_tables t
              join pg_class c on c.relname = t.tablename
              where t.schemaname='public' and not c.relrowsecurity;
            if n <> 0 then raise exception '% tabelle senza RLS', n; end if;
            -- trigger del gate presente
            if not exists (select 1 from pg_trigger where tgname='issues_publish_gate') then
              raise exception 'trigger issues_publish_gate assente';
            end if;
            -- seed idempotente: roster esattamente 10
            select count(*) into n from competitor_sources;
            if n <> 10 then raise exception 'seed non idempotente: % fonti', n; end if;
            -- il gate MORDE: publish senza prova deve fallire
            -- `sector` era 'ci' come sentinella, legale finche' la colonna era
            -- testo libero; dalla 0014 e' l'enum issue_sector e 'ci' non esiste.
            -- Il settore non entra in questa asserzione — serve solo una riga da
            -- provare a pubblicare — e a marcarla come sintetica basta il
            -- periodo '2099-01', che nessun numero vero avra' mai.
            insert into issues (number, period, sector) values (1, '2099-01', 'security');
            begin
              update issues set status='published' where period='2099-01';
              raise exception 'il publish gate NON ha bloccato';
            exception when others then
              if sqlerrm not like 'gate:%' then raise; end if;
            end;
            -- 0012: la barra editoriale sta SOLO in verified_signals. Se il
            -- trigger torna a nominare tier in casa, la regola e' di nuovo
            -- duplicata: e' esattamente il bug che 0012 chiude.
            if not exists (select 1 from pg_views where schemaname='public' and viewname='verified_signals') then
              raise exception 'vista verified_signals assente';
            end if;
            if pg_get_functiondef((select oid from pg_proc where proname='enforce_issue_gate')) ~ '\mtier\M' then
              raise exception 'barra editoriale duplicata: enforce_issue_gate non usa verified_signals';
            end if;

            -- La vista discrimina davvero: Tier-2 NON indipendente non e' prova,
            -- Tier-1 si'. Senza queste due, una vista che passa tutto sarebbe verde.
            insert into signals (issue_id, source_url, stage, tier, independent)
              select id, 'https://ci.test/t2-dipendente', 'verify', 2, false from issues where period='2099-01';
            begin
              update issues set status='approved' where period='2099-01';
              raise exception 'il gate ha accettato un Tier-2 NON indipendente';
            exception when others then
              if sqlerrm not like 'gate:%' then raise; end if;
            end;
            insert into signals (issue_id, source_url, stage, tier, independent)
              select id, 'https://ci.test/t1', 'verify', 1, null from issues where period='2099-01';
            update issues set status='approved' where period='2099-01';
            if (select approved_at from issues where period='2099-01') is null then
              raise exception 'approved_at non valorizzato dal gate';
            end if;

            raise notice 'db-rebuild OK: schema, RLS, seed, gate e barra unica verificati';
          end $$;
          SQL

  e2e:
    # DB live (dati sintetici 9999-01 + teardown provato) -> solo post-merge su main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, db-rebuild]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: E2E su DB live (gate + retrieval)
        working-directory: engine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
        run: npm run test:e2e
