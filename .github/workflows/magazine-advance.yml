name: Magazine advance

# Il cron giornaliero che spinge avanti il magazine di UNO stadio, quando un
# gesto di Marco in Studio l'ha sbloccato: signal verificati -> generate
# (bozza a DB + issue "approva"); numero approvato -> embed, poi export ->
# PR di CONTENUTO. La decisione sta in engine/advance.mjs (testata a secco);
# qui solo l'esecuzione. I due gate umani (verify e approvazione in Studio)
# e il merge della PR contenuto restano di Marco: il publish gate a DB non
# si tocca.
#
# Le PR create col GITHUB_TOKEN non triggerano i CI `pull_request`
# (anti-ricorsione GitHub): i check richiesti dal ruleset si lanciano da qui
# via workflow_dispatch, così Marco trova la PR già verde. Nessun auto-merge:
# il contenuto lo merge lui.
#
# Nessun dato dell'evento entra in un `run:`; sector e period arrivano dal DB
# e sono validati con regex prima di toccare la shell.
on:
  schedule:
    - cron: "30 6 * * *" # ogni giorno alle 06:30 UTC
  workflow_dispatch: {} # run manuale on-demand

permissions:
  contents: write # push del branch contenuto
  pull-requests: write # apertura della PR contenuto
  actions: write # dispatch dei CI sul branch della PR
  issues: write # notifiche "tocca a te" e issue on-failure

concurrency:
  group: magazine-advance
  cancel-in-progress: false

jobs:
  advance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # pin per SHA (supply-chain): il tag e' mobile, il commit no
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Decidi ed esegui lo stadio sbloccato
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # stdout = lo stadio, stderr = il motivo e il contatore di attesa.
          # L'`if !` non e' cerimonia: sotto `set -e` una sostituzione di comando
          # fallita interrompe lo step SULL'ASSEGNAZIONE, e un `cat` sulla riga
          # dopo non gira mai. Cosi' il messaggio di un advance che crolla resta
          # nel log invece di morire dentro il file.
          if ! stage=$(node engine/advance.mjs 2>/tmp/advance.err); then
            cat /tmp/advance.err >&2
            exit 1
          fi
          cat /tmp/advance.err >&2
          echo "advance dice: $stage"

          # --- Ciclo di vita della segnalazione di attesa ---------------------
          # Vive FUORI dal case: una issue che nessuno chiude suona una volta sola
          # nella vita del repo. Dal secondo blocco in poi il cron ne modificherebbe
          # il corpo, e una modifica di corpo non manda nessuna notifica; nel mezzo
          # resterebbe aperta a dire "fermo da 9 giorni" mentre la pipeline gira.
          # Anche questa schermata: sotto `set -o pipefail` un grep che non trova
          # niente fa fallire l'assegnazione e ferma lo step PRIMA del case, cioe'
          # il notificatore fermerebbe la pipeline. Il contratto ATTESA= e' provato
          # da un test dell'engine, ma se i due divergono deve tacere l'allarme,
          # non saltare l'avanzamento del giorno.
          giorni=$(grep '^ATTESA=' /tmp/advance.err | cut -d= -f2 || true)
          motivo=$(sed -n 's/^advance: //p' /tmp/advance.err | head -1)
          titolo="Magazine fermo a un gate umano"
          # --author: il titolo da solo non basta a riconoscere la propria issue.
          # Il repo e' pubblico, chiunque puo' aprirne una con lo stesso titolo, e
          # il cron finirebbe per aggiornare quella invece di aprire la sua:
          # l'allarme resterebbe muto proprio nel caso che deve coprire.
          # Tutto il ciclo di vita gira PRIMA del case: se fallisce non deve fermare
          # lo step, o il notificatore bloccherebbe la pipeline che sorveglia. Ma
          # "la chiamata e' fallita" e "non c'e' nessuna issue aperta" non sono la
          # stessa cosa: confonderle aprirebbe una seconda issue per lo stesso
          # blocco. Quindi si distingue l'esito, e su fallimento si salta il giro.
          if aperta=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --author app/github-actions \
            --search "\"$titolo\" in:title" --json number --jq '.[0].number // empty'); then
            notifica=1
          else
            notifica=0
            aperta=""
            echo "avviso: lettura della issue di attesa fallita, ciclo di vita saltato per oggi" >&2
          fi
          if [ "$notifica" = 1 ] && [ -n "$giorni" ] && [ "$giorni" -ge 2 ]; then
            corpo=$(printf '%s\n\n%s\n\n%s' \
              "La pipeline risponde \`niente\` da **$giorni giorni**: $motivo" \
              "I due gate sono in Supabase Studio: il verify dei signal (tier) e l'approvazione del numero. Finche' non li apri, il cron gira verde senza avere niente da fare." \
              "Ultima run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
            # `|| true` da solo era il difetto che questa feature esiste per
            # togliere, rimesso dentro l'allarme: su un 5xx la issue non nasceva,
            # non si stampava niente e la run restava verde. Ogni esito ha una
            # riga, e nessun log dichiara un successo che non c'e' stato.
            if [ -n "$aperta" ]; then
              if gh issue edit "$aperta" --repo "$GITHUB_REPOSITORY" --body "$corpo"; then
                echo "attesa da $giorni giorni: issue #$aperta aggiornata"
              else
                echo "avviso: aggiornamento della issue di attesa fallito (attesa da $giorni giorni)" >&2
              fi
            else
              if gh issue create --repo "$GITHUB_REPOSITORY" --title "$titolo" --body "$corpo"; then
                echo "attesa da $giorni giorni: issue di attesa aperta"
              else
                echo "avviso: apertura della issue di attesa fallita (attesa da $giorni giorni)" >&2
              fi
            fi
          elif [ "$notifica" = 1 ] && [ -n "$aperta" ] && { [ "$stage" != "niente" ] || [ "$motivo" = "nessun numero in lavorazione" ]; }; then
            # Chiusa alla ripartenza, cosi' il blocco successivo apre una issue
            # NUOVA, che notifica. Una per blocco, non una per sempre. La chiusura
            # vuole uno stadio che avanza davvero: con `niente` e ATTESA vuota il
            # numero puo' essere sparito da sotto (pubblicato o cancellato a mano),
            # e annunciare una ripartenza che non c'e' stata spegnerebbe l'allarme
            # per un blocco ancora aperto. Si chiude anche quando il numero non
            # c'e' piu' (motivo "nessun numero in lavorazione"): li' il blocco e'
            # finito per davvero, e lasciare la issue aperta renderebbe muto
            # l'allarme del blocco dopo, che diventerebbe una modifica di corpo.
            #
            # ponytail: due tetti dichiarati. (1) Chiudere la issue a mano senza
            # sbloccare ne fa nascere una nuova ogni 24h: manca uno snooze, si
            # aggiunge cercando anche fra le chiuse di recente. (2) La PR di
            # contenuto non mergiata e' un quarto gate umano senza contatore, e il
            # giorno dell'export questo ramo annuncia "ripartita" mentre la
            # pipeline si ferma li': si copre quando il conteggio sapra' leggere
            # anche lo stato delle PR aperte.
            if gh issue close "$aperta" --repo "$GITHUB_REPOSITORY" \
              --comment "Sbloccato: la pipeline e' ripartita (stadio: $stage)."; then
              echo "attesa finita: issue #$aperta chiusa"
            else
              echo "avviso: chiusura della issue di attesa fallita, resta aperta la #$aperta" >&2
            fi
          fi
          case "$stage" in
            niente)
              exit 0
              ;;
            embed)
              node engine/embed.mjs
              ;;
            generate\ *)
              sector="${stage#generate }"
              [[ "$sector" =~ ^[a-z0-9-]+$ ]] || { echo "sector non valido"; exit 1; }
              node engine/generate.mjs "$sector"
              gh issue create --repo "$GITHUB_REPOSITORY" \
                --title "Magazine ($sector): bozza generata — tocca a te" \
                --body "La bozza IT+EN è a DB (status draft). Prossimo gate umano: leggila e approvala in Supabase Studio. Appena approvata, il cron advance embedda ed esporta da solo, e apre la PR di contenuto. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
              ;;
            export\ *)
              period="${stage#export }"
              [[ "$period" =~ ^[0-9]{4}-[0-9]{2}$ ]] || { echo "period non valido"; exit 1; }
              node engine/export.mjs "$period"
              # status --porcelain, non diff: i file di un numero NUOVO sono
              # untracked e `git diff` non li vede.
              if [ -z "$(git status --porcelain -- astro-project/src/content/magazine/)" ]; then
                echo "export idempotente: nessun file nuovo"
                exit 0
              fi
              branch="magazine/$period"
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git checkout -b "$branch"
              git add astro-project/src/content/magazine/
              git commit -m "content(magazine): numero $period dalla pipeline (gate umani passati)"
              git push -u origin "$branch"
              pr=$(gh pr create --title "content(magazine): numero $period" \
                --body "Numero esportato dalla pipeline dopo i due gate umani in Studio (verify dei signal, approvazione della bozza). Contenuto: la merge è di Marco. I CI sono lanciati dal workflow (le PR del bot non li triggerano da sole).")
              gh workflow run site-ci.yml --ref "$branch"
              gh workflow run backend-ci.yml --ref "$branch"
              # il judge non e' un check del ruleset: e' il referto di qualita'
              # che Marco trova in commento sulla PR prima di mergiare
              gh workflow run magazine-judge.yml --ref "$branch"
              echo "PR contenuto aperta: $pr"
              ;;
            *)
              echo "stadio sconosciuto: $stage"
              exit 1
              ;;
          esac
      - name: Apri issue se l'advance fallisce
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Magazine advance fallito ($(date -u +%F))" \
            --body "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID — errore su Sentry (script: advance/generate/embed/export)."
