name: Sentinella cron

# Sorveglia i cron che NON hanno un monitor Sentry: sono ancora partiti?
#
# Un errore si vede — lo script fallisce, `catchTopLevel` manda l'evento, il workflow
# apre la issue. Un cron che non parte non produce niente da vedere, e GitHub
# disabilita gli schedule dopo 60 giorni di inattivita' sul repository, in silenzio.
#
# La strada canonica sarebbe un cron monitor Sentry, che si allarma sull'ASSENZA del
# check-in. Non e' percorribile: Sentry include UN SOLO cron monitor per piano e il
# seggio e' di `supabase-keepalive` (ri-misurato via API il 03-09: gli altri tre
# esistono, restano `disabled` e NON ricevono niente — "No check-ins found",
# `ok=0 error=0 missed=0`. La riga diceva "ricevono i check-in": letta il 13-08 e
# ri-misurata il 31-08 in llm-council, ma mai propagata qui — il check-in viene spedito
# e buttato). Quindi il pattern e' rovesciato
# — un guardiano ATTIVO che manda un evento, non un monitor passivo che ne aspetta uno.
# La quota errori del piano free e' ampia; i seggi cron sono uno.
#
# Vive qui perche' questo sito ha attivita' quasi quotidiana e i suoi schedule non
# scadono. Una guardia che muore dello stesso male che sorveglia non serve a niente.
#
# GIORNALIERO dal 14-08, non piu' settimanale. Due motivi: il keepalive gira ogni tre
# giorni e va visto entro il suo limite di 5, e soprattutto questo workflow e' ora un
# anello della copertura reciproca — piu' spesso batte, piu' stretta e' la finestra in
# cui un cron morto resta invisibile. I limiti stanno nello script, non qui.
#
# SICUREZZA: nessun payload di evento entra in un `run:`. Le uniche interpolazioni
# sono un secret, il token del repo e i contesti statici della run.
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  battito:
    name: I cron sorvegliati battono ancora?
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # per la issue automatica quando uno tace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # La logica del verdetto prima della rete: se il confronto sulle date si rompe,
      # o se un limite in tabella scende sotto il proprio periodo, questo step lo dice
      # invece di lasciare passare per sempre un "viva".
      - name: Self-check della logica
        run: node scripts/sentinella-cron.mjs --self-check

      # Nessun token GitHub: i workflow run di un repo pubblico si leggono in anonimo,
      # quindi niente PAT cross-repo da custodire per leggere llm-council.
      #
      # Il DSN invece serve: e' l'evento a Sentry a fare da allarme al posto del cron
      # monitor che non possiamo accendere. Senza DSN lo script resta un no-op su quel
      # fronte e il verdetto non cambia — fail-open, come tutto il resto di sentry.mjs.
      - name: Controlla il battito
        id: battito
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          # `set -o pipefail` NON e' rumore: senza, l'exit code di questa pipeline
          # e' quello di `tee`, cioe' SEMPRE 0, e GitHub aggiunge pipefail solo se
          # si dichiara `shell: bash`. Misurato: `bash -e -c 'node -e
          # "process.exit(1)" | tee'` esce 0. Finche' e' mancato, `steps.battito`
          # risultava riuscito anche con un cron muto, e la issue qui sotto non
          # poteva aprirsi: la sentinella era essa stessa silenziosa, dello stesso
          # male che sorveglia. `magazine-judge` e `devto-publish-due` lo mettono
          # gia'; questo file era l'unico rimasto senza.
          set -o pipefail
          node scripts/sentinella-cron.mjs | tee battito.txt

      # La sonda del canale commerciale, ospite di questa sentinella e non di un
      # workflow suo: la tabella di `scripts/healthchecks.mjs` accetta solo finestre
      # derivate da un `gap` MISURATO su run reali, e un workflow nuovo non ne ha.
      # Qui eredita uno schedule quotidiano gia' misurato e un monitor gia' acceso,
      # senza aggiungere stime a un file che dichiara di non averne.
      #
      # `always()`: se il battito e' rosso il canale contatti va controllato lo
      # stesso. Due guasti diversi non devono nascondersi a vicenda, e senza questo
      # la sonda non partirebbe proprio nel giorno in cui qualcosa gia' non va.
      - name: Self-check della sonda contatto
        if: always()
        run: node scripts/sonda-contatto.mjs --self-check

      # `continue-on-error` qui NON e' indulgenza: serve a far arrivare l'esecuzione
      # al passo che apre la issue. Il rosso torna in fondo, nell'ultimo step, dove
      # non puo' piu' impedire niente.
      - name: Il form di contatto puo' ancora consegnare?
        id: contatto
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/sonda-contatto.mjs | tee contatto.txt

      # La issue si apre QUI anche per i cron di llm-council: il GITHUB_TOKEN vale solo
      # per il repo che lo emette, e un PAT cross-repo sarebbe una credenziale
      # long-lived creata per aprire una issue l'anno.
      #
      # Sentry e la issue non sono ridondanti: l'evento arriva dove Marco guarda ogni
      # giorno, la issue resta attaccata al repo e non si chiude da sola.
      - name: Apri una issue se qualcuno tace
        if: failure() && steps.battito.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          TITOLO: "Un cron sorvegliato non spara piu'"
        run: |
          # Un cron spento resta spento finche' qualcuno non lo riaccende: senza questo
          # controllo si aprirebbe una issue identica ogni martedi'.
          aperte=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITOLO" --json number --jq 'length')
          if [ "$aperte" != "0" ]; then
            echo "issue gia' aperta, non ne apro un'altra"
            exit 0
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "$TITOLO" \
            --body "$(printf '%s\n' \
              "Almeno un cron sorvegliato non risulta partito entro il suo limite." \
              "" \
              '```' \
              "$(cat battito.txt)" \
              '```' \
              "" \
              "Causa tipica: GitHub disabilita gli schedule dopo 60 giorni senza attivita' sul repository." \
              "Si riaccende dalla tab Actions del repo interessato, oppure con un commit qualsiasi." \
              "" \
              "Lo stesso allarme e' arrivato su Sentry come evento CronMuto." \
              "" \
              "Run di questo controllo: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"

      # Una issue SUA, non un capitolo di quella dei cron: il titolo e' cio' che
      # Marco legge per primo, e "un cron non spara piu'" manderebbe a cercare nel
      # posto sbagliato un guasto che sta altrove.
      - name: Apri una issue se il canale contatti e' chiuso
        if: always() && steps.contatto.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          TITOLO: "Il canale contatti non risulta sano"
        run: |
          # Stessa deduplica del blocco sopra: un canale chiuso resta chiuso finche'
          # qualcuno non rigenera la chiave, e una issue al giorno sarebbe rumore.
          aperte=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITOLO" --json number --jq 'length')
          if [ "$aperte" != "0" ]; then
            echo "issue gia' aperta, non ne apro un'altra"
            exit 0
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "$TITOLO" \
            --body "$(printf '%s\n' \
              "La sonda non ha dato via libera al canale che porta clienti." \
              "La riga qui sotto dice se il verdetto e' CHIUSO (il Worker non si fa accettare da" \
              "Resend) oppure INCERTO (la sonda non ha ottenuto risposta): sono cose diverse." \
              "" \
              '```' \
              "$(cat contatto.txt)" \
              '```' \
              "" \
              "Cosa fare: rigenerare la chiave su Resend, poi riscriverla nei DUE posti che la tengono," \
              "il Worker (\`npx wrangler secret put RESEND_API_KEY\`) e Doppler. Sono copie separate:" \
              "il deploy non le sincronizza, quindi allinearne una sola lascia il guasto in piedi." \
              "" \
              "Storia: dal 10-07 al 04-09-2026 questo e' rimasto rotto in silenzio, perche' il guasto" \
              "si vedeva solo se qualcuno premeva Invia. Questa sonda esiste per non ripeterlo." \
              "" \
              "Run di questo controllo: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"

      # Il rosso arriva in fondo, dopo che la issue e' stata aperta. Un workflow verde
      # con la rotta commerciale chiusa sarebbe esattamente il tipo di verde che
      # questa giornata ha insegnato a non fidarsi.
      - name: Verdetto sul canale contatti
        if: always() && steps.contatto.outcome == 'failure'
        run: exit 1
