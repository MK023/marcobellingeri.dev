name: Edicola card

# La card dell'Edicola nasce da sola: quando un articolo della writing collection
# risulta PUBBLICATO su dev.to (il publish è il gesto umano di Marco, lì), questo
# cron aggiunge la card a src/data/edicola.json e la porta fino in produzione.
#
# Lo stesso run cross-posta il pezzo su CoderLegion. Sta qui e non nel cron del
# publish (07:00) perché CoderLegion non ha nessuna idempotenza interrogabile
# (source_url è write-only, "i miei post" è riservato alla Master Key), quindi il
# registro deve essere nostro — ed è edicola.json, che solo questo workflow
# committa. Un pezzo entra in `nuove()` una volta sola: quella è la volta in cui
# viene creato di là. Se la create fallisce il run muore prima di scrivere, e
# domani riparte: nessuna card, nessun commit, nessun doppione.
#
# Il caso non coperto, dichiarato: create riuscita e run morto PRIMA del merge.
# Lì il post esiste e il registro no, e domani nasce un doppione — si nasconde con
# una `POST /posts/{id}/hide`. La rete automatica per quel caso è stata scritta e
# tolta: per coprirlo serviva scandire il feed pubblico, che è cieco ai post in
# coda di moderazione e fallisce aperto su ogni risposta inattesa.
#
# L'attesa prima del merge è in due tempi, e non è prudenza: i tre check richiesti
# verdi e "la PR è mergiabile" sono due domande diverse, e la seconda arriva dopo.
# Il 2026-08-21 il merge partiva un secondo dopo il terzo verde, quando GitHub non
# aveva ancora ricalcolato, e si prendeva "the base branch policy prohibits the
# merge". Ora si aspetta anche mergeStateStatus.
#
# La decisione (verdi? mergiabile? tempo scaduto?) sta in engine/edicola-gate.mjs,
# che ha i suoi test; qui resta solo l'esecuzione. Stessa forma di advance.mjs.
#
# L'anti-ricorsione del GITHUB_TOKEN non salta i workflow: li PARCHEGGIA. Una PR
# creata qui fa nascere i run `pull_request` in `action_required`, fermi in attesa
# di approvazione — e una PR con le proprie check suite parcheggiate resta BLOCKED
# per chiunque, bot o umano. Misurato il 2026-08-21: run creati alle 13:11:16,
# approvati alle 13:23:42, PR mergiabile e mergiata alle 13:24:36. Quindi qui si
# approvano, invece di lanciare una copia dei CI che finirebbe attaccata a un
# dispatch e non alla PR.
#
# Il Deploy invece resta da lanciare a mano: il push del merge del bot non triggera
# il `push`, e li' l'eccezione documentata e' workflow_dispatch.
#
# Nessun dato dell'evento entra in un `run:`: branch e contenuti sono generati qui.
on:
  schedule:
    - cron: "30 7 * * *" # ogni giorno alle 07:30 UTC
  workflow_dispatch: {} # run manuale on-demand

permissions:
  contents: write # push del branch card
  pull-requests: write # apertura e merge della PR
  actions: write # dispatch dei CI sul branch e del Deploy su main
  issues: write # per l'issue automatica on-failure

concurrency:
  group: edicola-card
  cancel-in-progress: false

jobs:
  card:
    runs-on: ubuntu-latest
    # 45 e non 30: i due loop d'attesa che seguono (fino a ~2 min di approvazione
    # dei CI + fino a ~20 min di mergiabilita') impegnavano gia' ~22 dei 30, e il
    # passo nuovo puo' aggiungere fino a 3 min di backoff 429 per pezzo. A 30 il
    # timeout sarebbe scattato DOPO la create e PRIMA del merge — cioe' proprio
    # nella finestra da cui nasce il doppione.
    timeout-minutes: 45
    steps:
      # pin per SHA (supply-chain): il tag e' mobile, il commit no
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Genera le card mancanti e cross-posta su CoderLegion
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          CODERLEGION_API_KEY: ${{ secrets.CODERLEGION_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: node engine/edicola.mjs # zero dipendenze npm: nessun install
      - name: PR, attesa della mergiabilita', merge, deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- astro-project/src/data/edicola.json; then
            echo "nessuna card nuova: finito qui"
            exit 0
          fi
          branch="edicola/card-$(date -u +%Y%m%d%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "feat(edicola): card automatica dagli articoli pubblicati su dev.to e CoderLegion"
          git push -u origin "$branch"
          pr=$(gh pr create --title "feat(edicola): card automatica da dev.to e CoderLegion" \
            --body "Card generate da engine/edicola.mjs (cron Edicola card): articoli pubblicati su dev.to con canonical sul sito, cross-postati su CoderLegion nello stesso run (l'id del post e' nel campo \`coderlegion\` della card). I CI di questa PR nascono parcheggiati (anti-ricorsione del GITHUB_TOKEN) e li sblocca il workflow. Merge automatico quando i tre check richiesti sono verdi E GitHub ha ricalcolato la mergiabilita'.")

          # I CI della PR esistono gia' ma sono parcheggiati (vedi testata): si
          # approvano. GitHub li crea qualche secondo dopo la PR, quindi si
          # riprova finche' non compaiono.
          sha=$(git rev-parse HEAD)
          approvati=0
          for _ in $(seq 1 12); do
            sleep 10
            for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$sha" \
              --jq '.workflow_runs[] | select(.event=="pull_request" and .conclusion=="action_required") | .id'); do
              gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve" --silent
              approvati=$((approvati + 1))
            done
            if [ "$approvati" -gt 0 ]; then break; fi
          done
          if [ "$approvati" -eq 0 ]; then
            echo "nessun run pull_request da approvare: i CI non partirebbero, meglio fermarsi"
            exit 1
          fi
          echo "run pull_request approvati: $approvati"

          # Il contatore scende: a zero il gate risponde `ferma` invece di
          # aspettare per sempre. La soglia di "verde" e i nomi dei check
          # richiesti stanno nel gate, non qui.
          azione=aspetta
          for i in $(seq 60 -1 0); do
            sleep 20
            stato=$(gh pr view "$pr" --json mergeStateStatus --jq .mergeStateStatus)
            azione=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?per_page=100" \
              | node engine/edicola-gate.mjs "$stato" "$i")
            [ "$azione" = "aspetta" ] || break
          done
          [ "$azione" = "mergia" ] || { echo "niente merge: $azione"; exit 1; }

          gh pr merge "$pr" --squash --delete-branch
          # Il push su main del bot non triggera il Deploy: si lancia qui.
          gh workflow run deploy.yml --ref main
      - name: Apri issue se la card fallisce
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Edicola card fallita ($(date -u +%F))" \
            --body "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID — la card resta in PR se creata. Se il run era arrivato al cross-post, il post su CoderLegion PUO' gia' esistere: controlla su coderlegion.com PRIMA di rilanciare, altrimenti nasce un doppione."
