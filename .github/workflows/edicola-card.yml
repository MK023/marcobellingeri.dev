name: Edicola card

# La card dell'Edicola nasce da sola: quando un articolo della writing collection
# risulta PUBBLICATO su dev.to (il publish è il gesto umano di Marco, lì), questo
# cron aggiunge la card a src/data/edicola.json e ne apre la PR.
#
# Il bot si ferma alla PR: il merge è di Marco. Non è una regola di stile, è
# quello che fa il ruleset di main. Con require_extra_approval_for_unattributed_changes
# una PR firmata github-actions[bot] resta BLOCKED anche a tre check verdi e con
# un'approvazione addosso — misurato il 2026-08-21 sullo stesso identico contenuto:
# PR umana CLEAN, PR del bot BLOCKED. Il merge umano fa partire il Deploy da solo,
# quindi qui non si lancia più niente dopo la PR.
#
# I CI invece vanno lanciati: GitHub non fa partire workflow da eventi generati col
# GITHUB_TOKEN (anti-ricorsione), quindi una PR creata qui non triggererebbe i CI
# `pull_request`. L'eccezione documentata è workflow_dispatch.
#
# Nessun dato dell'evento entra in un `run:`: branch e contenuti sono generati qui.
on:
  schedule:
    - cron: "30 7 * * *" # ogni giorno alle 07:30 UTC
  workflow_dispatch: {} # run manuale on-demand

permissions:
  contents: write # push del branch card
  pull-requests: write # apertura della PR
  actions: write # dispatch dei CI sul branch della card
  issues: write # per l'issue automatica on-failure

concurrency:
  group: edicola-card
  cancel-in-progress: false

jobs:
  card:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # pin per SHA (supply-chain): il tag e' mobile, il commit no
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Genera le card mancanti
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: node engine/edicola.mjs # zero dipendenze npm: nessun install
      - name: Apre la PR della card e lancia i CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- astro-project/src/data/edicola.json; then
            echo "nessuna card nuova: finito qui"
            exit 0
          fi
          branch="edicola/card-$(date -u +%Y%m%d%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "feat(edicola): card automatica dagli articoli pubblicati su dev.to"
          git push -u origin "$branch"
          pr=$(gh pr create --title "feat(edicola): card automatica da dev.to" \
            --body "Card generate da engine/edicola.mjs (cron Edicola card): articoli pubblicati su dev.to con canonical sul sito. I CI sono lanciati dal workflow (le PR del bot non li triggerano da sole). La merge e il deploy sono di Marco.")

          # I CI non partono da soli su una PR del bot (vedi testata): si lanciano qui.
          gh workflow run site-ci.yml --ref "$branch"
          gh workflow run backend-ci.yml --ref "$branch"
          echo "card in PR, il merge e' tuo: $pr"
      - name: Apri issue se la card fallisce
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Edicola card fallita ($(date -u +%F))" \
            --body "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID — la card resta in PR se creata."
