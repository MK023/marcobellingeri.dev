name: Supabase keepalive

# Il free tier Supabase PAUSA il progetto dopo 7 giorni senza attivita'.
# Ping ultra-leggero ogni 3 giorni (margine 2x): una GET con chiave anon
# conta come attivita'. Nessuna action, nessun checkout: solo curl.
#
# NB (gotcha noto): GitHub disabilita gli schedule dopo 60 giorni senza
# attivita' sul REPO — se il progetto va in pausa lunga, questo cron si spegne
# in silenzio e Supabase pausera'. Con sviluppo attivo non succede.
#
# Contro proprio QUESTO c'e' il check-in Sentry in coda al job. L'issue automatica
# qui sotto scatta se il ping FALLISCE; nessuno pero' si accorge se il job non
# parte affatto — ed e' lo scenario peggiore, perche' e' quello che porta alla
# pausa del database. Un cron monitor si allarma sull'ASSENZA del check-in: se
# GitHub spegne lo schedule, Sentry lo segnala come "missed".
on:
  schedule:
    - cron: "0 5 */3 * *"
  # Per collaudare il check-in senza aspettare tre giorni.
  workflow_dispatch:

permissions:
  issues: write # per l'issue automatica on-failure
  contents: read # per il checkout richiesto dal guardiano dei cron, sotto

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # Checkout e node servono SOLO al guardiano in coda: il ping e' un curl e resta
      # tale. Trenta secondi in piu' ogni tre giorni per non lasciare scoperto l'unico
      # anello che non ha nessuno sopra di se'.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Ping REST (query minima, chiave anon)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/issues?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "keepalive -> HTTP $code"
          test "$code" = "200"
      - name: Apri issue se il ping fallisce
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Keepalive Supabase fallito ($(date -u +%F)) — rischio pause a 7gg" \
            --body "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      # Check-in del cron monitor. `monitor_config` fa l'upsert: il monitor nasce
      # da solo al primo check-in, e la sua config vive qui.
      #
      # NB: dal 02-09-2026 la schedule del monitor NON rispecchia piu' il `cron:`
      # qui sopra, ed e' voluto (vedi il blocco sotto). Prima la regola era
      # "si cambiano insieme"; ora sono due cose diverse — il `cron:` dice quando
      # GitHub PROVA a partire, il monitor quanto tempo puo' passare fra due
      # check-in. Cambiare la cadenza del cron significa toccare `value`/`unit`
      # dell'intervallo, non ricopiare la stringa crontab.
      #
      # La chiave nell'URL e' la public key del DSN: e' pubblica per costruzione
      # (identifica il progetto, non autentica), la stessa gia' nel codice del sito.
      #
      # `|| true` NON e' pigrizia: questo step sorveglia il keepalive, e un guardiano
      # che uccide cio' che sorveglia e' peggio di nessun guardiano. Se Sentry e' giu'
      # o l'URL cambia, il ping a Supabase resta comunque andato a buon fine.
      # L'ALTRA META' DELLA COPERTURA RECIPROCA.
      #
      # `sentinella-cron.yml` sorveglia i cron senza monitor — incluso questo. Ma se
      # tace LUI non se ne accorge nessuno, ed e' il problema circolare che questo step
      # chiude: questo workflow e' l'unico con un monitor Sentry ATTIVO, quindi e' il
      # posto giusto da cui guardare il guardiano.
      #
      # Non serviva spostare il seggio cron: il keepalive tiene il suo allarme diretto
      # (un DB in pausa costa piu' di tutto il resto) e in cambio presta i suoi occhi.
      #
      # `continue-on-error` perche' questo passo NON e' il keepalive: un guardiano che
      # fa fallire cio' che ospita e' peggio di nessun guardiano. Se il guardiano tace,
      # l'evento Sentry parte comunque dallo script.
      - name: E il guardiano dei cron, batte ancora?
        if: always()
        continue-on-error: true
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: node scripts/sentinella-cron.mjs

      # Lo schedule del monitor e' `interval`, non `crontab`, e NON e' un dettaglio:
      # con `crontab` Sentry aspetta il check-in a un ORARIO (le 05:00 + margine), e
      # quello che misura diventa la puntualita' dello scheduler di GitHub, non la
      # salute del keepalive. Misurato il 02-09-2026 sugli otto run precedenti: tutti
      # `success`, ma le partenze sono passate da +33 min (16-25/08) a +12h16 il
      # 28/08, +6h29 il 31/08, +4h52 il 01/09. Undici issue aperte dal 16/07, ognuna
      # richiusa da sola appena il run arrivava davvero. Un allarme che dice il vero
      # su un fatto senza conseguenze e' un allarme che si impara a ignorare.
      #
      # `interval` ancora l'attesa all'ULTIMO check-in ricevuto: un run in ritardo
      # sposta in avanti anche il successivo, quindi il ritardo non si accumula in un
      # allarme.
      #
      # MARGINE ALZATO A 1080 MIN (18h) il 2026-09-04. I 720 erano dimensionati sugli
      # otto run allora disponibili; rimisurato sui venti divari successivi, il
      # peggiore e' 83h42 contro una finestra di 84h esatte — diciotto minuti di
      # margine. Non e' mai scattato, ma era un falso allarme in attesa, cioe'
      # esattamente cio' da cui il passaggio a `interval` voleva uscire. A 18h il
      # margine torna a 6h18. La lezione e' sul metodo, non sul numero: un margine
      # dimensionato su otto campioni va rimisurato quando i campioni diventano venti.
      #
      # Cosa si perde, dichiarato: un cron davvero morto ora si scopre entro
      # 3 giorni + 18 ore invece di 05:00 + 2 ore. E' il prezzo, ed e' accettato
      # perche' cio' che il keepalive protegge e' la sospensione del progetto free
      # tier, che si misura in giorni e non in ore.
      #
      # Questo check-in Sentry resta ACCESO in parallelo a healthchecks per il primo
      # ciclo completo (~4 giorni): se il ping healthchecks fosse cablato male non lo
      # scopriresti da un allarme mancato, lo scopriresti dal database in pausa.
      # Va rimosso dopo la verifica, e con lui si libera l'unico seggio cron di Sentry.
      #
      # Il ritardo di GitHub NON si corregge qui: e' scheduling best-effort
      # dichiarato dal fornitore, verificato il 31/08 anche su un altro repo.
      - name: Check-in Sentry (il cron e' vivo)
        if: always()
        env:
          ESITO: ${{ job.status }}
        run: |
          stato=ok
          [ "$ESITO" = "success" ] || stato=error
          curl -sS -m 10 -X POST \
            "https://o4511713634484224.ingest.de.sentry.io/api/4511714029273168/cron/supabase-keepalive/ffcac5d108001982eb70aa431c32af75/" \
            -H 'Content-Type: application/json' \
            -d "{\"monitor_config\":{\"schedule\":{\"type\":\"interval\",\"value\":3,\"unit\":\"day\"},\"timezone\":\"UTC\",\"checkin_margin\":1080,\"max_runtime\":10},\"status\":\"$stato\"}" \
            && echo "check-in Sentry: $stato" \
            || echo "check-in Sentry non riuscito — il keepalive resta valido"
          exit 0
